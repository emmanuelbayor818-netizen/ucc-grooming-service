# Firebase App Hosting Configuration for UCC Grooming Service (Next.js)
# Docs: https://firebase.google.com/docs/app-hosting

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ucc-grooming-service
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ucc-grooming-service.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ucc-grooming-service.appspot.com
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
  # Production secrets managed in Google Cloud Secret Manager
  - variable: PAYSTACK_SECRET_KEY
    secret: paystack-secret-key
  - variable: PAYSTACK_WEBHOOK_SECRET
    secret: paystack-webhook-secret
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: firebase-admin-private-key
